[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipikar"
version = "0.0.0"
description = "Handwritten Bengali document recognition for Bangladeshi land deeds"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Saidul Islam Rajib" }]
dependencies = [
    "regex>=2024.5.15",
    "numpy>=1.26",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-regex>=2024.5.15",
]

[tool.setuptools.packages.find]
include = ["lipikar*"]

[tool.setuptools.package-data]
lipikar = ["resources/strings/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lipikar"]

[tool.coverage.report]
fail_under = 70
